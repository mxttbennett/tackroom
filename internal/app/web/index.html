  <div class="app">
    <aside class="side">
      <div class="side-head">
        <a class="brand" href="#overview"><svg class="mark" aria-hidden="true"><use href="#logo"/></svg><span>tackroom</span></a>
        <p class="scope" id="scope" title="Config root"></p>
        <button id="open-nav" class="icon-button quiet nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="views"><svg aria-hidden="true"><use href="#i-menu"/></svg></button>
      </div>
      <nav id="views" class="tabs" aria-label="Views">
        <a href="#overview" data-view="overview" title="Overview"><svg class="ico" aria-hidden="true"><use href="#i-overview"/></svg><span class="label">Overview</span></a>
        <a href="#skills" data-view="skills" title="Skills"><svg class="ico" aria-hidden="true"><use href="#i-skills"/></svg><span class="label">Skills</span> <span class="count" data-count="skills"></span></a>
        <a href="#roles" data-view="roles" title="Roles"><svg class="ico" aria-hidden="true"><use href="#i-roles"/></svg><span class="label">Roles</span> <span class="count" data-count="roles"></span></a>
        <a href="#wiring" data-view="wiring" title="MCP & hooks"><svg class="ico" aria-hidden="true"><use href="#i-wiring"/></svg><span class="label">MCP &amp; hooks</span> <span class="count" data-count="wiring"></span></a>
        <a href="#unmanaged" data-view="unmanaged" title="Unmanaged"><svg class="ico" aria-hidden="true"><use href="#i-unmanaged"/></svg><span class="label">Unmanaged</span> <span class="count" data-count="unmanaged"></span></a>
        <a href="#crons" data-view="crons" title="Crons"><svg class="ico" aria-hidden="true"><use href="#i-crons"/></svg><span class="label">Crons</span> <span class="count" data-count="crons"></span></a>
        <a href="#config" data-view="config" title="Config"><svg class="ico" aria-hidden="true"><use href="#i-config"/></svg><span class="label">Config</span></a>
      </nav>
      <div class="side-foot">
        <details id="links-menu" class="menu" hidden><summary><svg class="ico" aria-hidden="true"><use href="#i-out"/></svg><span class="label">Links</span></summary><nav id="links" class="menu-list" aria-label="Configured links"></nav></details>
      </div>
    </aside>

    <header class="topbar">
      <p class="crumb" id="crumb"></p>
      <div class="top-actions">
        <button id="open-sync" class="sync-button" type="button"><svg aria-hidden="true"><use href="#i-sync"/></svg><span id="sync-label">Sync</span></button>
      </div>
    </header>

    <main id="main" class="main">
      <section id="view-overview" class="view" data-view="overview"></section>
      <section id="view-skills" class="view" data-view="skills" hidden></section>
      <section id="view-roles" class="view" data-view="roles" hidden></section>
      <section id="view-wiring" class="view" data-view="wiring" hidden></section>
      <section id="view-unmanaged" class="view" data-view="unmanaged" hidden></section>
      <section id="view-crons" class="view" data-view="crons" hidden></section>
      <section id="view-config" class="view" data-view="config" hidden></section>
    </main>
  </div>

  <dialog id="sync-panel" class="panel" aria-labelledby="sync-title">
    <div class="panel-head">
      <div><p class="eyebrow">Sync to agents</p><h2 id="sync-title">Review changes</h2></div>
      <button id="close-sync" class="icon-button" type="button" aria-label="Close"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div id="sync-body" class="panel-body"></div>
    <div class="panel-foot">
      <p id="sync-note" class="note"></p>
      <div class="foot-actions">
        <button id="cancel-sync" type="button">Cancel</button>
        <button id="apply-sync" class="primary" type="button" disabled>Apply sync</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
